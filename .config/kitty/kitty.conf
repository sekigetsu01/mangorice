font_family Terminess Nerd Font Mono
font_size 10.5
modify_font cell_height -2px
modify_font baseline 1
disable_ligatures always
italic_font      family="Terminess Nerd Font Mono" style=Regular
bold_italic_font family="Terminess Nerd Font Mono" style=Bold
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Hack Nerd Font

include ~/.cache/wal/kitty-colors.conf
background_opacity 0.8
dynamic_background_opacity yes
include ~/.cache/kitty-opacity.conf
repaint_delay 16

window_padding_width 5
placement_strategy top-left
hide_window_decorations yes
tab_bar_style hidden
confirm_os_window_close 0
enable_audio_bell no
linux_display_server wayland
sync_to_monitor no

cursor_shape beam
cursor_blink_interval 0
cursor_trail 0

scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 5.0

copy_on_select clipboard
strip_trailing_spaces smart

open_url_with /home/user/.local/bin/open-link
url_style straight

allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty
shell_integration enabled

map alt+k scroll_line_up
map alt+j scroll_line_down
map alt+u remote_control scroll-window 0.5p-
map alt+d remote_control scroll-window 0.5p
map alt+c copy_or_noop
map alt+v paste_from_clipboard
map --when-focus-on var:in_editor alt+v
map alt+shift+k change_font_size current +1.0
map alt+shift+j change_font_size current -1.0
map ctrl+kp_add change_font_size current +1.0
map ctrl+kp_subtract change_font_size current -1.0
map alt+o open_url_with_hints
map ctrl+shift+o open_url_with_hints
map alt+shift+o kitten hints --type url --program @
map alt+shift+c launch --stdin-source=@last_cmd_output --type=background wl-copy
map alt+enter launch --type=os-window --cwd=current
map ctrl+shift+n launch --type=os-window --cwd=current
